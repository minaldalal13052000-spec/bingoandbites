<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bingo & Bites</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root { --teal: #1A535C; --pink: #FF2E63; --cream: #FFF9E7; --orange: #F37121; }
        body { margin: 0; padding: 0; background-color: var(--teal); font-family: 'Quicksand', sans-serif; color: var(--teal); overflow-x: hidden; }
        .mobile-wrapper { display: flex; flex-direction: column; align-items: center; padding: 10px; min-height: 100vh; box-sizing: border-box; }
        header { text-align: center; width: 100%; color: var(--cream); margin-bottom: 5px; }
        h1 { font-family: 'Fredoka One', cursive; color: var(--pink); font-size: 2.2rem; margin: 5px 0; }
        .current-call { background: var(--cream); padding: 8px; border-radius: 15px; border: 4px solid var(--orange); width: 100px; margin: 10px auto; text-align: center; }
        #current-number { font-size: 2.2rem; font-family: 'Fredoka One'; color: var(--pink); }
        .mobile-card { background: var(--cream); padding: 20px; border-radius: 20px; width: 95%; max-width: 400px; text-align: center; box-sizing: border-box; }
        .mobile-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; width: 100%; max-width: 380px; margin: 10px 0; }
        .cell { aspect-ratio: 1/1; background: white; border: 2px solid var(--teal); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; font-weight: bold; cursor: pointer; }
        .cell.stamped { background: var(--orange) !important; color: white !important; }
        .btn-main { background: var(--pink); color: white; border: none; padding: 15px; border-radius: 50px; font-family: 'Fredoka One'; font-size: 1.2rem; width: 100%; cursor: pointer; margin-top: 10px; }
        .btn-win { background: var(--pink); color: white; border: none; padding: 8px 15px; border-radius: 10px; font-family: 'Fredoka One'; font-size: 1rem; }
        .btn-new-game { background: var(--teal) !important; }
        .round-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; background: var(--cream); padding: 10px; border-radius: 10px; box-sizing: border-box; }
        .leaderboard-drawer { width: 95%; background: rgba(255, 255, 255, 0.1); border-radius: 15px; padding: 15px; color: white; margin-top: 15px; box-sizing: border-box; }
        #score-list { list-style: none; padding: 0; margin: 0; }
        #score-list li { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.2); }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(26, 83, 92, 0.85); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .overlay-content { background: var(--cream); padding: 30px; border-radius: 20px; border: 8px solid var(--orange); text-align: center; width: 85%; }
        input { width: 100%; padding: 12px; border-radius: 10px; border: 2px solid var(--teal); font-size: 1rem; box-sizing: border-box; }
    </style>
</head>
<body>
    <div id="winner-overlay" class="overlay">
        <div class="overlay-content">
            <h2 id="winner-announcement" style="font-family:'Fredoka One'; color:var(--pink); font-size: 2rem;">BINGO!</h2>
            <p>Verification time!</p>
            <button onclick="closeOverlay()" class="btn-main">VIEW BOARD TO VERIFY</button>
        </div>
    </div>

    <div class="mobile-wrapper">
        <header>
            <h1>Bingo & Bites</h1>
            <div class="current-call"><small>CALLING</small><div id="current-number">--</div></div>
            <div id="admin-controls" style="display:none; margin-bottom: 10px;">
                <button onclick="callNextNumber()" class="btn-main" style="background:var(--orange); margin: 0;">DRAW NUMBER</button>
                <button onclick="resetSystem()" style="background:none; border:none; color:white; font-size:10px; margin-top:5px; text-decoration:underline;">RESET DATA</button>
            </div>
        </header>

        <div id="setup" class="mobile-card">
            <input type="text" id="username" placeholder="Enter Name..." maxlength="12">
            <button onclick="startGame()" class="btn-main">JOIN GAME</button>
        </div>

        <div id="game-area" style="display:none; width: 100%; flex-direction: column; align-items: center;">
            <div class="round-bar">
                <span id="round-text" style="font-weight:bold;">ROUND 1</span>
                <button id="action-btn" onclick="claimBingo()" class="btn-win">BINGO!</button>
            </div>
            <div id="bingo-board" class="mobile-grid"></div>
        </div>

        <div class="leaderboard-drawer">
            <h3 style="margin-top:0;">Leaderboard (Total Score)</h3>
            <ul id="score-list"></ul>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBEIL7wQrJ3n2rnGr9FsMPH25KnBSihHDg",
            authDomain: "bingo-3fa41.firebaseapp.com",
            databaseURL: "https://bingo-3fa41-default-rtdb.firebaseio.com",
            projectId: "bingo-3fa41",
            storageBucket: "bingo-3fa41.firebasestorage.app",
            messagingSenderId: "1015132936323",
            appId: "1:1015132936323:web:d47520d3e1a1b62f2f23b6"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let myName = "";
        let currentRound = 1;
        const isAdmin = new URLSearchParams(window.location.search).get('admin') === 'true';

        if (isAdmin) document.getElementById('admin-controls').style.display = 'block';

        window.startGame = function() {
            myName = document.getElementById('username').value.trim();
            if(!myName) return alert("Enter name!");
            db.ref('players/' + myName).update({ name: myName, totalScore: 0 });
            document.getElementById('setup').style.display = 'none';
            document.getElementById('game-area').style.display = 'flex';
            generateBoard();
        };

        window.generateBoard = function() {
            const board = document.getElementById('bingo-board');
            board.innerHTML = '';
            let items = Array.from({length: 75}, (_, i) => i + 1).sort(() => Math.random() - 0.5).slice(0, 25);
            items.forEach((item, index) => {
                const cell = document.createElement('div');
                cell.className = 'cell';
                if (index === 12) { cell.innerText = "FREE"; cell.classList.add('stamped'); }
                else {
                    cell.innerText = item;
                    cell.onclick = function() { 
                        this.classList.toggle('stamped');
                        if(navigator.vibrate) navigator.vibrate(40);
                    };
                }
                board.appendChild(cell);
            });
            // Reset button to Bingo state
            const btn = document.getElementById('action-btn');
            btn.innerText = "BINGO!";
            btn.classList.remove('btn-new-game');
            btn.onclick = claimBingo;
        };

        window.callNextNumber = function() {
            db.ref('gameState/history').get().then((snap) => {
                let history = snap.val() || [];
                let nextNum;
                do { nextNum = Math.floor(Math.random() * 75) + 1; } while (history.includes(nextNum));
                history.push(nextNum);
                db.ref('gameState').update({ currentNumber: nextNum, history: history });
            });
        };

        window.claimBingo = function() {
            db.ref('gameState').update({ lastWinner: myName });
            db.ref('players/' + myName + '/totalScore').set(firebase.database.ServerValue.increment(10));
            
            // Transform button for winner
            const btn = document.getElementById('action-btn');
            btn.innerText = "NEW GAME";
            btn.classList.add('btn-new-game');
            btn.onclick = startNextRound;
        };

        window.closeOverlay = function() {
            document.getElementById('winner-overlay').style.display = 'none';
        };

        window.startNextRound = function() {
            db.ref('gameState').update({ lastWinner: null, history: [], currentNumber: "--", roundSignal: Date.now() });
        };

        db.ref('gameState/currentNumber').on('value', (s) => {
            document.getElementById('current-number').innerText = s.val() || "--";
        });

        db.ref('gameState/lastWinner').on('value', (s) => {
            const winner = s.val();
            const overlay = document.getElementById('winner-overlay');
            if (winner) {
                document.getElementById('winner-announcement').innerText = winner + " GOT BINGO!";
                overlay.style.display = 'flex';
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                
                // For non-winners, transform their button to New Game too
                const btn = document.getElementById('action-btn');
                btn.innerText = "NEW GAME";
                btn.classList.add('btn-new-game');
                btn.onclick = startNextRound;
            } else {
                overlay.style.display = 'none';
            }
        });

        db.ref('gameState/roundSignal').on('value', () => {
            if (myName) {
                currentRound++;
                if (currentRound <= 4) {
                    document.getElementById('round-text').innerText = "ROUND " + currentRound;
                    generateBoard();
                }
            }
        });

        db.ref('players').on('value', (s) => {
            const list = document.getElementById('score-list');
            list.innerHTML = "";
            const players = s.val();
            if(players) {
                Object.values(players).sort((a,b) => b.totalScore - a.totalScore).forEach(p => {
                    list.innerHTML += `<li><span>${p.name}</span> <span>${p.totalScore} pts</span></li>`;
                });
            }
        });

        window.resetSystem = () => { if(confirm("Reset entire game?")) db.ref().set(null).then(()=>location.reload()); };
    </script>
</body>
</html>
